# ---- Datasource: H2 in-memory ----
spring.datasource.url=jdbc:h2:mem:shopee_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- JPA ----
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Do NOT run data.sql (contains PostgreSQL-specific syntax e.g. BIGSERIAL)
spring.sql.init.mode=never

# ---- JWT (reuse main values) ----
jwt.secret=bXlTZWNyZXRLZXkxMjM0NTY3ODlteVNlY3JldEtleTEyMzQ1Njc4OW15U2VjcmV0S2V5
jwt.expiration=900000
jwt.refresh-expiration=604800000

# ---- Mail: stub out (no real SMTP needed) ----
spring.mail.host=localhost
spring.mail.port=3025

# ---- Disable the audit-log cleanup cron in tests ----
audit.log.cleanup-cron=-
audit.log.retention-days=90

# ---- CORS (not used in service-layer tests, but avoids missing-property warnings) ----
app.cors.allowed-origins=http://localhost:5173
